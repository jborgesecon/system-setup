# ./configs/neptune/system/R/main.yml
---
- name: Configure PostgreSQL defaults
  vars:
    pg_data_dir: /var/lib/pgsql/data
    pg_hba_file: /var/lib/pgsql/data/pg_hba.conf
    pg_user: user
    pg_password: "password"
  block:
    - name: Initialize PostgreSQL database if not already initialized
      command: postgresql-setup --initdb
      args:
        creates: "{{ pg_data_dir }}/PG_VERSION"

    - name: Ensure PostgreSQL is enabled and started
      systemd:
        name: postgresql
        enabled: true
        state: started

    - name: Ensure PostgreSQL Python bindings are installed (required for postgresql_user)
      dnf:
        name: python3-psycopg2
        state: present

    - name: Create PostgreSQL user
      become_user: postgres
      postgresql_user:
        name: "{{ pg_user }}"
        password: "{{ pg_password }}"
        encrypted: true

    - name: Configure pg_hba.conf - allow postgres trust
      lineinfile:
        path: "{{ pg_hba_file }}"
        regexp: '^local\s+all\s+postgres'
        line: 'local   all             postgres                                trust'
        state: present
        backup: yes

    - name: Configure pg_hba.conf - enforce md5 for all other local users
      lineinfile:
        path: "{{ pg_hba_file }}"
        regexp: '^local\s+all\s+all'
        line: 'local   all             all                                     md5'
        state: present

    - name: Configure pg_hba.conf - enforce md5 for IPv4 localhost
      lineinfile:
        path: "{{ pg_hba_file }}"
        regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32'
        line: 'host    all             all             127.0.0.1/32            md5'
        state: present

    - name: Configure pg_hba.conf - enforce md5 for IPv6 localhost
      lineinfile:
        path: "{{ pg_hba_file }}"
        regexp: '^host\s+all\s+all\s+::1/128'
        line: 'host    all             all             ::1/128                 md5'
        state: present

    - name: Reload PostgreSQL to apply pg_hba.conf changes
      systemd:
        name: postgresql
        state: reloaded

