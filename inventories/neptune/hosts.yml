# ./inventories/neptune/hosts.yml
---
all:
  children:
    neptune_workstations:
      hosts:
        neptune:
          ansible_host: 127.0.0.1
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
  vars:
    profile_target: neptune


