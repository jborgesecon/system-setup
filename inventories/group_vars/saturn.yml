---
profile_name: Saturn
profile_timezone: America/New_York
profile_locale: en_US.UTF-8
profile_admin_user: "{{ lookup('env', 'USER') | default('borges') }}"
profile_state: provision

dnf_packages:
  - git
  - gcc
  - gcc-c++
  - make
  - cmake
  - python3
  - python3-pip
  - python3-virtualenv
  - neovim
  - tmux
  - htop
  - ripgrep
  - fd-find
  - fzf
  - zsh
  - alacritty
  - docker
  - docker-compose
  - podman
  - postgresql-server
  - postgresql-contrib
  - openvpn
  - NetworkManager-openvpn
  - firewalld
  - ansible
  - ccache
  - libpq-devel
  - jq
  - unzip

dnf_remove_packages:
  - gnome-tour
  - rhythmbox

rpm_packages:
  - name: brave-browser
    url: https://dl.brave.com/linux/rpm/x86_64/brave-browser-release-latest.x86_64.rpm
    description: Brave browser release channel
  - name: zoom
    url: https://zoom.us/client/latest/zoom_x86_64.rpm
    description: Zoom client for research calls

flatpak_packages:
  - name: com.visualstudio.code
    remote: flathub
    state: present
  - name: com.spotify.Client
    remote: flathub
    state: present
  - name: md.obsidian.Obsidian
    remote: flathub
    state: present

flatpak_remove_packages:
  - org.gnome.Tour

user_configs:
  - name: Neovim config
    src: configs/user/neovim/init.lua
    dest: "/home/{{ profile_admin_user }}/.config/nvim/init.lua"
    mode: "0644"
  - name: Zsh config
    src: configs/user/zsh/.zshrc
    dest: "/home/{{ profile_admin_user }}/.zshrc"
    mode: "0644"
  - name: Alacritty config
    src: configs/user/alacritty/alacritty.yml
    dest: "/home/{{ profile_admin_user }}/.config/alacritty/alacritty.yml"
    mode: "0644"

system_configs:
  - name: Docker daemon
    src: configs/system/docker/daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  - name: PostgreSQL config
    src: configs/system/postgresql/postgresql.conf
    dest: /var/lib/pgsql/data/postgresql.conf
    mode: "0640"
    owner: postgres
    group: postgres
  - name: OpenVPN client
    src: configs/system/openvpn/saturn-lab.conf
    dest: /etc/openvpn/client/saturn-lab.conf
    mode: "0600"

firewall_rules:
  services:
    - docker
    - postgresql
  ports:
    - port: 5432
      proto: tcp
      zone: public
    - port: 943
      proto: tcp
      zone: public

subdomain_mappings:
  - host: pg.saturn.local
    ip: 127.0.0.1
  - host: registry.saturn.local
    ip: 127.0.0.1

network_tweaks:
  - name: net.core.somaxconn
    value: "1024"
  - name: net.ipv4.ip_local_port_range
    value: "1024 65000"

system_services:
  enable:
    - firewalld
    - docker
    - postgresql
    - openvpn-client@saturn-lab
  disable:
    - NetworkManager-wait-online

postgresql_cluster_name: saturn
postgresql_locale: en_US.UTF-8
postgresql_encoding: UTF8
postgresql_initdb: true


  - "{{ profile_admin_user }}"
