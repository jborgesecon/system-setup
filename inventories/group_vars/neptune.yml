# ./inventories/group_vars/neptune.yml
---
profile_name: neptune
profile_timezone: America/Sao_Paulo
profile_locale: en_US.UTF-8
profile_admin_user: "{{ lookup('env', 'USER') | default('john') }}"
profile_state: provision

# RPM packages section
rpm_packages:
  - name: brave-browser
    url: https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    description: Brave browser release channel

# DNF managed apps
dnf_packages:
  # utilities
  - gcc
  - gcc-c++
  - make
  - cmake
  - ansible
  - unzip
  - dnf-plugins-core

  # terminal and shell
  - htop
  - fastfetch
  - tree
  - zsh
  - alacritty
  - neovim
  - tmux

  # development & data analysis
  - git
  - python3
  - R
  - gretl
  - postgresql
  - podman
  - podman-docker
  - docker-compose

  # vpn, firewal, system management
  - firewalld
  - qdirstat

  # other apps
  - tor
  - qbittorrent
  - calibre
  - obs-studio
  - brave-browser

# dnf_remove_packages:

# flatpak managed apps
flatpak_packages: []
flatpak_remove_packages: []


