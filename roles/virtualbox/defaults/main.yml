---
# roles/virtualbox/defaults/main.yml

virtualbox_vboxconfig_path: /usr/bin/akmods
virtualbox_kernel_module: "/lib/modules/{{ ansible_facts['kernel'] }}/extra/VirtualBox/vboxdrv.ko.xz"
virtualbox_group: vboxusers
virtualbox_users: []

# RPM Fusion VirtualBox packages (Fedora 45+ compatible)
virtualbox_packages:
  - VirtualBox
  - akmod-VirtualBox
  - virtualbox-guest-additions

virtualbox_guest_additions_iso: "/usr/share/virtualbox/VBoxGuestAdditions.iso"
