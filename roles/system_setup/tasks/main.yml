---
- name: Configure system timezone
  become: true
  community.general.timezone:
    name: "{{ profile_timezone }}"
  when:
    - profile_timezone is defined
    - profile_state | default('provision') != 'clean'
  tags:
    - setup
    - timezone

- name: Apply locale settings
  become: true
  ansible.builtin.command:
    cmd: "localectl set-locale LANG={{ profile_locale }}"
  when:
    - profile_locale is defined
    - profile_state | default('provision') != 'clean'
  changed_when: false
  tags:
    - setup
    - locale

- name: Apply network sysctl tuning
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ network_tweaks | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - profile_state | default('provision') != 'clean'
    - network_tweaks | default([]) | length > 0
  tags:
    - setup
    - networking

- name: Remove sysctl overrides during cleanup
  become: true
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    state: absent
    reload: true
  loop: "{{ network_tweaks | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - profile_state | default('provision') == 'clean'
    - network_tweaks | default([]) | length > 0
  tags:
    - setup
    - networking
    - cleanup

- name: Ensure firewalld is running for rule management
  become: true
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when:
    - profile_state | default('provision') != 'clean'
    - (firewall_rules | default({})).services | default([]) | length > 0 or (firewall_rules | default({})).ports | default([]) | length > 0
  tags:
    - setup
    - firewall

- name: Open firewall services
  become: true
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
    zone: "{{ (firewall_rules | default({})).zone | default('public') }}"
  loop: "{{ (firewall_rules | default({})).services | default([]) }}"
  when:
    - profile_state | default('provision') != 'clean'
    - (firewall_rules | default({})).services | default([]) | length > 0
  tags:
    - setup
    - firewall

- name: Open firewall ports
  become: true
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
    permanent: true
    state: enabled
    immediate: true
    zone: "{{ item.zone | default((firewall_rules | default({})).zone | default('public')) }}"
  loop: "{{ (firewall_rules | default({})).ports | default([]) }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"
  when:
    - profile_state | default('provision') != 'clean'
    - (firewall_rules | default({})).ports | default([]) | length > 0
  tags:
    - setup
    - firewall

- name: Disable firewall services during cleanup
  become: true
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: disabled
    immediate: true
    zone: "{{ (firewall_rules | default({})).zone | default('public') }}"
  loop: "{{ (firewall_rules | default({})).services | default([]) }}"
  when:
    - profile_state | default('provision') == 'clean'
    - (firewall_rules | default({})).services | default([]) | length > 0
  tags:
    - setup
    - firewall
    - cleanup

- name: Disable firewall ports during cleanup
  become: true
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
    permanent: true
    state: disabled
    immediate: true
    zone: "{{ item.zone | default((firewall_rules | default({})).zone | default('public')) }}"
  loop: "{{ (firewall_rules | default({})).ports | default([]) }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"
  when:
    - profile_state | default('provision') == 'clean'
    - (firewall_rules | default({})).ports | default([]) | length > 0
  tags:
    - setup
    - firewall
    - cleanup

- name: Add Saturn lab entries to /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ip }} {{ item.host }}"
    state: present
    create: false
  loop: "{{ subdomain_mappings | default([]) }}"
  loop_control:
    label: "{{ item.host }}"
  when:
    - profile_state | default('provision') != 'clean'
    - subdomain_mappings | default([]) | length > 0
  tags:
    - setup
    - networking

- name: Remove Saturn lab entries when cleaning
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "{{ item.ip | regex_escape }}\\s+{{ item.host | regex_escape }}"
    state: absent
  loop: "{{ subdomain_mappings | default([]) }}"
  loop_control:
    label: "{{ item.host }}"
  when:
    - profile_state | default('provision') == 'clean'
    - subdomain_mappings | default([]) | length > 0
  tags:
    - setup
    - networking
    - cleanup

- name: Ensure docker group exists
  become: true
  ansible.builtin.group:
    name: docker
    state: present
  when: profile_state | default('provision') != 'clean'
  tags:
    - setup
    - docker

- name: Add users to docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default([]) }}"
  when:
    - profile_state | default('provision') != 'clean'
    - docker_users | default([]) | length > 0
  tags:
    - setup
    - docker

- name: Initialize PostgreSQL cluster if requested
  become: true
  ansible.builtin.command:
    cmd: /usr/bin/postgresql-setup --initdb --unit postgresql
  args:
    creates: /var/lib/pgsql/data/PG_VERSION
  environment:
    PGSETUP_INITDB_OPTIONS: "--encoding={{ postgresql_encoding | default('UTF8') }} --locale={{ postgresql_locale | default('en_US.UTF-8') }}"
  when:
    - profile_state | default('provision') != 'clean'
    - postgresql_initdb | default(false)
  tags:
    - setup
    - postgresql

- name: Manage critical services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ (system_services | default({})).enable | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - profile_state | default('provision') != 'clean'
    - (system_services | default({})).enable | default([]) | length > 0
  tags:
    - setup
    - services

- name: Disable unwanted services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ (system_services | default({})).disable | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: (system_services | default({})).disable | default([]) | length > 0
  tags:
    - setup
    - services

- name: Stop and disable managed services during cleanup
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ (system_services | default({})).enable | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - profile_state | default('provision') == 'clean'
    - (system_services | default({})).enable | default([]) | length > 0
  tags:
    - setup
    - services
    - cleanup
