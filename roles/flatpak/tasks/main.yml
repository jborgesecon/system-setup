# ./roles/flatpak/tasks/main.yml
---
- name: Ensure flatpak package is installed
  become: true
  ansible.builtin.dnf:
    name: flatpak
    state: present
  when: profile_state == "provision"

- name: Add Flathub remote if not present
  become: true
  community.general.flatpak_remote:
    name: "{{ flatpak_remote | default('flathub') }}"
    state: present
    flatpakrepo_url: "{{ flatpak_remote_url | default('https://flathub.org/repo/flathub.flatpakrepo') }}"
  when:
    - profile_state == "provision"

- name: Install flatpak packages
  become: true
  community.general.flatpak:
    name: "{{ item.name | default(item) }}"
    remote: "{{ item.remote | default(flatpak_remote | default('flathub')) }}"
    state: present
    method: system
  loop: "{{ flatpak_packages | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item) }}"
  when:
    - profile_state == "provision"
    - flatpak_packages is defined and flatpak_packages | length > 0

- name: Remove flatpak packages
  become: true
  community.general.flatpak:
    name: "{{ item.name | default(item) }}"
    remote: "{{ item.remote | default(flatpak_remote | default('flathub')) }}"
    state: absent
    method: system
  loop: "{{ flatpak_remove_packages | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item) }}"
  when:
    - profile_state == "clean"
    - flatpak_remove_packages is defined and flatpak_remove_packages | length > 0
