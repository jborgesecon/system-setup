---
- name: Clean Saturn-managed components
  hosts: saturn
  become: true
  gather_facts: true
  vars_files:
    - "../inventories/group_vars/{{ profile_target | default('saturn') }}.yml"
  vars:
    profile_state: clean
    repo_root: "{{ playbook_dir }}/.."
  roles:
    - dnf
    - rpm
    - flatpak
    - system_setup
    - system_configs
    - user_configs
