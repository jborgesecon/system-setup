---
# playbooks/build-neptune.yml

- name: Build Neptune profile
  hosts: npt
  become: true
  gather_facts: true

  roles:
    - role: core_packages
      tags: [core_packages, packages]
    - role: python
      tags: [python]
    - role: postgresql
      tags: [postgresql]
    - role: r_lang
      tags: [r_lang, r]
    - role: alacritty
      tags: [alacritty, configs]
    - role: tmux
      tags: [tmux, configs]
    - role: zsh
      tags: [zsh, configs]
    - role: neovim
      tags: [neovim, configs]
    - role: virtualbox
      tags: [virtualbox]
    - role: publishing_tools
      tags: [publishing_tools]
